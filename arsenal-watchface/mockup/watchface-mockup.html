<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsenal FC 2025/26 Watch Face</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1e2d3d 0%, #15232f 50%, #0d1820 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
            padding: 20px;
        }

        h1 {
            font-size: 1.4rem;
            margin-bottom: 8px;
            color: #E8FF00;
            text-align: center;
            font-weight: 600;
        }

        .subtitle {
            color: #8899aa;
            margin-bottom: 25px;
            font-size: 0.85rem;
        }

        .watch-container {
            position: relative;
            width: 340px;
            height: 340px;
        }

        .watch-bezel {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(145deg, #4a5a6a, #2a3a4a);
            box-shadow:
                0 15px 50px rgba(0, 0, 0, 0.6),
                inset 0 2px 3px rgba(255, 255, 255, 0.15),
                inset 0 -3px 6px rgba(0, 0, 0, 0.4);
            padding: 12px;
        }

        .watch-screen {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #0a1520;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.5);
        }

        /* Geometric Pattern - Matching Reference */
        .geo-pattern {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 1;
        }

        /* Arsenal Cannon - Professional SVG */
        .cannon-logo {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: 58px;
            height: 24px;
            z-index: 10;
        }

        /* Hour Markers */
        .markers {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 5;
        }

        .marker {
            position: absolute;
            background: #FF2882;
            left: 50%;
            transform-origin: center bottom;
        }

        .marker-major {
            width: 4px;
            height: 16px;
            margin-left: -2px;
            border-radius: 2px;
        }

        .marker-minor {
            width: 2px;
            height: 8px;
            margin-left: -1px;
            border-radius: 1px;
        }

        /* Clock Hands */
        .hands-container {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 15;
        }

        .hand {
            position: absolute;
            left: 50%;
            bottom: 50%;
            transform-origin: center bottom;
        }

        .hour-hand {
            width: 10px;
            height: 55px;
            margin-left: -5px;
            background: linear-gradient(to top, #E8FF00 0%, #D4F000 100%);
            border-radius: 5px 5px 3px 3px;
            box-shadow: 0 0 8px rgba(232, 255, 0, 0.5);
        }

        .minute-hand {
            width: 8px;
            height: 80px;
            margin-left: -4px;
            background: linear-gradient(to top, #E8FF00 0%, #D4F000 100%);
            border-radius: 4px 4px 2px 2px;
            box-shadow: 0 0 8px rgba(232, 255, 0, 0.5);
        }

        .second-hand {
            width: 2px;
            height: 90px;
            margin-left: -1px;
            background: #FF2882;
            border-radius: 1px;
            box-shadow: 0 0 6px rgba(255, 40, 130, 0.6);
        }

        .center-pin {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 14px;
            height: 14px;
            background: radial-gradient(circle at 30% 30%, #FF4090, #FF2882, #cc1166);
            border-radius: 50%;
            z-index: 20;
            box-shadow: 0 0 8px rgba(255, 40, 130, 0.8);
        }

        /* Battery Indicator */
        .battery-indicator {
            position: absolute;
            top: 55px;
            right: 30px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            z-index: 10;
        }

        .battery-segment {
            width: 16px;
            height: 10px;
            background: #E8FF00;
            border-radius: 2px;
            box-shadow: 0 0 4px rgba(232, 255, 0, 0.4);
            transition: all 0.3s;
        }

        .battery-segment.off {
            background: #1a2530;
            box-shadow: none;
        }

        /* Info Display */
        .info-display {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
        }

        .time-row {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 6px;
            margin-bottom: 2px;
        }

        .day-label {
            font-size: 13px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 1.5px;
        }

        .digital-time {
            font-size: 26px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
            font-variant-numeric: tabular-nums;
        }

        .ampm {
            font-size: 11px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .steps-display {
            font-size: 15px;
            font-weight: 700;
            color: #E8FF00;
            letter-spacing: 2px;
            margin-top: 2px;
            text-shadow: 0 0 10px rgba(232, 255, 0, 0.3);
        }

        .date-display {
            font-size: 11px;
            color: #6688aa;
            letter-spacing: 2px;
            margin-top: 2px;
        }

        /* Match Section */
        .match-display {
            position: absolute;
            bottom: 45px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
            display: none;
        }

        .match-display.active {
            display: block;
        }

        .match-status {
            font-size: 11px;
            font-weight: 700;
            color: #FF2882;
            letter-spacing: 2px;
            margin-bottom: 3px;
        }

        .match-score {
            font-size: 26px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 2px;
        }

        .match-teams {
            font-size: 10px;
            color: #6688aa;
            letter-spacing: 1px;
        }

        .live-indicator {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #FF2882;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        /* Victory Glow */
        .victory-glow {
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #FF2882, #FF0066, #FF2882, #FF0066, #FF2882);
            opacity: 0;
            animation: none;
            z-index: -1;
        }

        .victory-glow.active {
            opacity: 1;
            animation: rotate 2s linear infinite, glow 1s ease-in-out infinite alternate;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes glow {
            from { filter: blur(4px); }
            to { filter: blur(8px); }
        }

        /* Away Stripe */
        .away-stripe {
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 60%;
            background: linear-gradient(to bottom, transparent, #D4A853, #D4A853, transparent);
            border-radius: 2px;
            opacity: 0;
            z-index: 10;
            transition: opacity 0.3s;
        }

        .away-stripe.visible {
            opacity: 1;
        }

        /* AOD Mode */
        .watch-screen.aod {
            background: #000;
        }

        .watch-screen.aod .geo-pattern,
        .watch-screen.aod .battery-indicator {
            opacity: 0;
        }

        .watch-screen.aod .marker {
            background: #333;
        }

        .watch-screen.aod .hour-hand,
        .watch-screen.aod .minute-hand {
            background: #444;
            box-shadow: none;
        }

        .watch-screen.aod .second-hand {
            opacity: 0;
        }

        .watch-screen.aod .center-pin {
            background: #333;
            box-shadow: none;
        }

        .watch-screen.aod .cannon-logo path,
        .watch-screen.aod .cannon-logo circle,
        .watch-screen.aod .cannon-logo line {
            fill: none !important;
            stroke: #333 !important;
        }

        .watch-screen.aod .digital-time,
        .watch-screen.aod .day-label,
        .watch-screen.aod .ampm {
            color: #444;
        }

        .watch-screen.aod .steps-display {
            color: #333;
            text-shadow: none;
        }

        .watch-screen.aod .date-display {
            color: #222;
        }

        /* Controls */
        .controls {
            margin-top: 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            max-width: 400px;
        }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #E8FF00, #c4d900);
            color: #0a1520;
        }

        .btn-secondary {
            background: #1a2530;
            color: #8899aa;
            border: 1px solid #2a3540;
        }

        .btn-danger {
            background: linear-gradient(135deg, #FF2882, #e01060);
            color: white;
        }

        .btn-gold {
            background: linear-gradient(135deg, #D4A853, #c49843);
            color: #0a1520;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* State Display */
        .state-box {
            margin-top: 15px;
            padding: 12px 20px;
            background: #0d1820;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #1a2530;
        }

        .state-label {
            font-size: 10px;
            color: #6688aa;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .state-value {
            font-size: 13px;
            color: #E8FF00;
            font-weight: 600;
            letter-spacing: 1px;
        }

        @media (max-width: 380px) {
            .watch-container {
                width: 300px;
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <h1>Arsenal FC 2025/26 Third Kit</h1>
    <p class="subtitle">Samsung Galaxy Watch 6 - Interactive Mockup</p>

    <div class="watch-container">
        <div class="victory-glow" id="victoryGlow"></div>
        <div class="watch-bezel">
            <div class="watch-screen" id="watchScreen">

                <!-- Geometric Pattern -->
                <svg class="geo-pattern" viewBox="0 0 316 316">
                    <defs>
                        <clipPath id="screenClip">
                            <circle cx="158" cy="158" r="158"/>
                        </clipPath>
                    </defs>
                    <g clip-path="url(#screenClip)">
                        <!-- Background -->
                        <rect width="316" height="316" fill="#0a1520"/>

                        <!-- Geometric Shapes - Bottom Half -->
                        <path d="M0,180 L50,150 L100,180 L100,230 L50,200 L0,230 Z" fill="#061018" opacity="0.8"/>
                        <path d="M70,200 L120,170 L170,200 L170,250 L120,220 L70,250 Z" fill="#061018" opacity="0.8"/>
                        <path d="M140,180 L190,150 L240,180 L240,230 L190,200 L140,230 Z" fill="#061018" opacity="0.8"/>
                        <path d="M210,200 L260,170 L310,200 L310,250 L260,220 L210,250 Z" fill="#061018" opacity="0.8"/>
                        <path d="M-20,230 L30,200 L80,230 L80,280 L30,250 L-20,280 Z" fill="#061018" opacity="0.8"/>
                        <path d="M50,250 L100,220 L150,250 L150,300 L100,270 L50,300 Z" fill="#061018" opacity="0.8"/>
                        <path d="M120,230 L170,200 L220,230 L220,280 L170,250 L120,280 Z" fill="#061018" opacity="0.8"/>
                        <path d="M190,250 L240,220 L290,250 L290,300 L240,270 L190,300 Z" fill="#061018" opacity="0.8"/>
                        <path d="M260,230 L310,200 L360,230 L360,280 L310,250 L260,280 Z" fill="#061018" opacity="0.8"/>

                        <!-- Stadium Silhouette -->
                        <g opacity="0.12" transform="translate(40, 100)">
                            <path d="M0,40 Q60,20 120,18 Q180,20 240,40" stroke="#3a4a5a" stroke-width="2" fill="none"/>
                            <line x1="20" y1="35" x2="20" y2="55" stroke="#3a4a5a" stroke-width="1"/>
                            <line x1="50" y1="28" x2="50" y2="55" stroke="#3a4a5a" stroke-width="1"/>
                            <line x1="80" y1="22" x2="80" y2="55" stroke="#3a4a5a" stroke-width="1"/>
                            <line x1="120" y1="18" x2="120" y2="55" stroke="#3a4a5a" stroke-width="1"/>
                            <line x1="160" y1="22" x2="160" y2="55" stroke="#3a4a5a" stroke-width="1"/>
                            <line x1="190" y1="28" x2="190" y2="55" stroke="#3a4a5a" stroke-width="1"/>
                            <line x1="220" y1="35" x2="220" y2="55" stroke="#3a4a5a" stroke-width="1"/>
                        </g>
                    </g>
                </svg>

                <!-- Arsenal Cannon Logo - Accurate Design -->
                <svg class="cannon-logo" viewBox="0 0 110 44">
                    <defs>
                        <linearGradient id="cannonGold" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#c9a355"/>
                            <stop offset="50%" stop-color="#a07830"/>
                            <stop offset="100%" stop-color="#8b6914"/>
                        </linearGradient>
                        <linearGradient id="barrelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#b8944a"/>
                            <stop offset="40%" stop-color="#96783c"/>
                            <stop offset="100%" stop-color="#7a6230"/>
                        </linearGradient>
                    </defs>

                    <!-- Cannon Barrel -->
                    <path d="M2,17 L4,15 L50,13 L52,15 L52,29 L50,31 L4,29 L2,27 Z" fill="url(#barrelGrad)"/>
                    <ellipse cx="3" cy="22" rx="3" ry="6" fill="#8b7335"/>

                    <!-- Barrel Detail Lines -->
                    <path d="M6,15 L48,13.5" stroke="#7a6230" stroke-width="0.5" fill="none"/>
                    <path d="M6,29 L48,30.5" stroke="#c9a355" stroke-width="0.5" fill="none"/>

                    <!-- Wheel Outer Ring -->
                    <circle cx="75" cy="22" r="20" fill="none" stroke="url(#cannonGold)" stroke-width="4"/>

                    <!-- Wheel Hub -->
                    <circle cx="75" cy="22" r="6" fill="url(#cannonGold)"/>
                    <circle cx="75" cy="22" r="3" fill="#6b5520"/>

                    <!-- Wheel Spokes - 8 spokes radiating from center -->
                    <line x1="75" y1="6" x2="75" y2="38" stroke="#a08040" stroke-width="2.5"/>
                    <line x1="59" y1="22" x2="91" y2="22" stroke="#a08040" stroke-width="2.5"/>
                    <line x1="63.7" y1="10.7" x2="86.3" y2="33.3" stroke="#a08040" stroke-width="2"/>
                    <line x1="63.7" y1="33.3" x2="86.3" y2="10.7" stroke="#a08040" stroke-width="2"/>

                    <!-- Spoke highlights -->
                    <line x1="75" y1="7" x2="75" y2="37" stroke="#c9a355" stroke-width="0.5"/>
                    <line x1="60" y1="22" x2="90" y2="22" stroke="#c9a355" stroke-width="0.5"/>
                </svg>

                <!-- Hour Markers -->
                <div class="markers" id="markers"></div>

                <!-- Away Stripe -->
                <div class="away-stripe" id="awayStripe"></div>

                <!-- Battery Indicator -->
                <div class="battery-indicator" id="batteryIndicator">
                    <div class="battery-segment" data-index="4"></div>
                    <div class="battery-segment" data-index="3"></div>
                    <div class="battery-segment" data-index="2"></div>
                    <div class="battery-segment" data-index="1"></div>
                    <div class="battery-segment" data-index="0"></div>
                </div>

                <!-- Clock Hands -->
                <div class="hands-container">
                    <div class="hand hour-hand" id="hourHand"></div>
                    <div class="hand minute-hand" id="minuteHand"></div>
                    <div class="hand second-hand" id="secondHand"></div>
                </div>
                <div class="center-pin"></div>

                <!-- Info Display -->
                <div class="info-display" id="infoDisplay">
                    <div class="time-row">
                        <span class="day-label" id="dayLabel">THU</span>
                        <span class="digital-time" id="digitalTime">6:43:16</span>
                        <span class="ampm" id="ampm">PM</span>
                    </div>
                    <div class="steps-display" id="stepsDisplay">12,450 STEPS</div>
                    <div class="date-display" id="dateDisplay">JAN 29</div>
                </div>

                <!-- Match Display -->
                <div class="match-display" id="matchDisplay">
                    <div class="match-status" id="matchStatus">
                        <span class="live-indicator"></span>LIVE 67'
                    </div>
                    <div class="match-score" id="matchScore">2 - 1</div>
                    <div class="match-teams">ARSENAL vs LIVERPOOL</div>
                </div>

            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn btn-primary" onclick="setState('normal')">Normal</button>
        <button class="btn btn-secondary" onclick="setState('upcoming')">Pre-Match</button>
        <button class="btn btn-danger" onclick="setState('live')">LIVE</button>
        <button class="btn btn-gold" onclick="setState('victory')">Victory!</button>
        <button class="btn btn-secondary" onclick="toggleAway()">Toggle Away</button>
        <button class="btn btn-secondary" onclick="toggleAOD()">AOD Mode</button>
    </div>

    <div class="state-box">
        <div class="state-label">Current State</div>
        <div class="state-value" id="currentState">NORMAL</div>
    </div>

    <script>
        // Generate hour markers
        function generateMarkers() {
            const container = document.getElementById('markers');
            const cx = 158, cy = 158, r = 145;

            for (let i = 0; i < 60; i++) {
                const angle = (i * 6 - 90) * Math.PI / 180;
                const marker = document.createElement('div');
                marker.className = 'marker';

                const isMajor = i % 5 === 0;
                marker.classList.add(isMajor ? 'marker-major' : 'marker-minor');

                const len = isMajor ? 16 : 8;
                const x = cx + (r - len/2) * Math.cos(angle);
                const y = cy + (r - len/2) * Math.sin(angle);

                marker.style.top = y + 'px';
                marker.style.transform = `translateX(-50%) rotate(${i * 6}deg)`;
                marker.style.left = x + 'px';

                container.appendChild(marker);
            }
        }

        // Update clock
        function updateClock() {
            const now = new Date();
            const h = now.getHours();
            const m = now.getMinutes();
            const s = now.getSeconds();

            // Analog hands
            const hourDeg = (h % 12) * 30 + m * 0.5;
            const minDeg = m * 6 + s * 0.1;
            const secDeg = s * 6;

            document.getElementById('hourHand').style.transform = `rotate(${hourDeg}deg)`;
            document.getElementById('minuteHand').style.transform = `rotate(${minDeg}deg)`;
            document.getElementById('secondHand').style.transform = `rotate(${secDeg}deg)`;

            // Digital time
            const h12 = h % 12 || 12;
            document.getElementById('digitalTime').textContent =
                `${h12}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            document.getElementById('ampm').textContent = h >= 12 ? 'PM' : 'AM';

            // Day & Date
            const days = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
            const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
            document.getElementById('dayLabel').textContent = days[now.getDay()];
            document.getElementById('dateDisplay').textContent = `${months[now.getMonth()]} ${now.getDate()}`;
        }

        // State management
        let state = 'normal';
        let isAway = false;
        let isAOD = false;

        function setState(newState) {
            state = newState;
            const info = document.getElementById('infoDisplay');
            const match = document.getElementById('matchDisplay');
            const glow = document.getElementById('victoryGlow');
            const status = document.getElementById('matchStatus');
            const score = document.getElementById('matchScore');

            glow.classList.remove('active');
            info.style.display = 'block';
            match.classList.remove('active');

            switch(newState) {
                case 'normal':
                    document.getElementById('currentState').textContent = 'NORMAL';
                    break;
                case 'upcoming':
                    info.style.display = 'none';
                    match.classList.add('active');
                    status.innerHTML = 'TODAY 17:30';
                    score.textContent = 'ARS vs LIV';
                    document.getElementById('currentState').textContent = 'MATCH UPCOMING';
                    break;
                case 'live':
                    info.style.display = 'none';
                    match.classList.add('active');
                    status.innerHTML = '<span class="live-indicator"></span>LIVE 67\'';
                    score.textContent = '2 - 1';
                    document.getElementById('currentState').textContent = 'MATCH LIVE';
                    break;
                case 'victory':
                    glow.classList.add('active');
                    info.style.display = 'none';
                    match.classList.add('active');
                    status.innerHTML = 'FULL TIME';
                    score.textContent = '2 - 1 WIN!';
                    document.getElementById('currentState').textContent = 'VICTORY!';
                    break;
            }
        }

        function toggleAway() {
            isAway = !isAway;
            document.getElementById('awayStripe').classList.toggle('visible', isAway);
        }

        function toggleAOD() {
            isAOD = !isAOD;
            document.getElementById('watchScreen').classList.toggle('aod', isAOD);
        }

        // Battery
        let battery = 80;
        function updateBattery() {
            const segs = document.querySelectorAll('.battery-segment');
            const active = Math.ceil(battery / 20);
            segs.forEach(seg => {
                const idx = parseInt(seg.dataset.index);
                seg.classList.toggle('off', idx >= active);
            });
        }

        setInterval(() => {
            battery = battery <= 5 ? 100 : battery - 1;
            updateBattery();
        }, 3000);

        // Steps simulation
        let steps = 12450;
        setInterval(() => {
            steps += Math.floor(Math.random() * 15);
            document.getElementById('stepsDisplay').textContent = steps.toLocaleString() + ' STEPS';
        }, 5000);

        // Init
        generateMarkers();
        updateClock();
        updateBattery();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
